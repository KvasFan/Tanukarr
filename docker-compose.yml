services:
  sonarr-pro:
    image: tanukarr:local
    build:
      context: .
    container_name: sonarr-pro
    restart: unless-stopped

    ports:
      - "${TANUKARR_BIND_ADDRESS:-${SONARRWEEB_BIND_ADDRESS:-${SONARR_PRO_BIND_ADDRESS:-127.0.0.1}}}:${TANUKARR_PORT:-${SONARRWEEB_PORT:-${SONARR_PRO_PORT:-6970}}}:8989"

    environment:
      # Files are written as this user. Run "id" on the host and use the numbers it
      # prints, otherwise downloads land as root and the host account cannot edit them.
      - PUID=${TANUKARR_PUID:-${SONARRWEEB_PUID:-${SONARR_PRO_PUID:-1000}}}
      - PGID=${TANUKARR_PGID:-${SONARRWEEB_PGID:-${SONARR_PRO_PGID:-1000}}}
      # Media group members can create subtitles and sidecars alongside imports.
      - UMASK=${TANUKARR_UMASK:-${SONARRWEEB_UMASK:-${SONARR_PRO_UMASK:-002}}}
      - TZ=${TANUKARR_TZ:-${SONARRWEEB_TZ:-${SONARR_PRO_TZ:-Etc/UTC}}}

    volumes:
      # Database, config.xml and logs. Back this up; everything else is replaceable.
      - ${TANUKARR_CONFIG_PATH:-${SONARRWEEB_CONFIG_PATH:-${SONARR_PRO_CONFIG_PATH:-./config}}}:/config

      # Media and downloads. Mount the download client's completed folder and the
      # library under a single parent so imports are a move on one filesystem rather
      # than a full copy across two.
      - ${TANUKARR_MEDIA_PATH:-${SONARRWEEB_MEDIA_PATH:-${SONARR_PRO_MEDIA_PATH:-./media}}}:/media
