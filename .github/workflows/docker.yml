name: Docker and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Pull requests build and run isolated checks without registry credentials.
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish:
    name: Verify and publish linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 120

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.image.outputs.version }}
      artifact: ${{ steps.image.outputs.artifact }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image and release version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="$(tr -d '\r\n' < VERSION)"
          gates=full
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$version" == "$(tr -d '\r\n' < VERSION)" ]] || exit 1
            # A release is tagged on a main commit whose code already passed the full
            # gate set on main. The tag repeats the build with every in-image suite and
            # the release-critical gates (version metadata, security, first run,
            # quality decisions, upgrade from the earlier release) instead of all of them.
            gates=light
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "gates=$gates" >> "$GITHUB_OUTPUT"
          echo "artifact=Tanukarr-$version-release" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          # latest always selects a tested release, while edge selects main.
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image with frontend and backend checks
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tanukarr:verified
          build-args: |
            TANUKARR_VERSION=${{ steps.image.outputs.version }}
            TANUKARR_SOURCE=https://github.com/${{ github.repository }}
            TANUKARR_REVISION=${{ github.sha }}
            TANUKARR_CREATED=${{ steps.image.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke checks
        run: |
          python3 docker/tests/smoke.py --image tanukarr:verified \
            --report "${RUNNER_TEMP}/tanukarr-smoke.json"

      - name: Isolated authentication and functional checks
        run: |
          python3 docker/tests/functional-security.py --image tanukarr:verified \
            --report "${RUNNER_TEMP}/tanukarr-functional-security.json"

      - name: Prepare disposable catalogue and RSS fixtures
        id: fixtures
        env:
          # Earlier published release (schema 252) populated by the library-upgrade gate.
          EARLIER_IMAGE: ghcr.io/kvasfan/tanukarr@sha256:74b13c7a6fd59222a498cb8bbb14be149a2d505846d684a8aa2e78de280dd9bd
          GATES: ${{ steps.image.outputs.gates }}
        run: |
          if ! command -v openssl >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends openssl ffmpeg
          fi
          docker pull python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          if [[ "$GATES" == full ]]; then
            docker pull jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
            docker pull lscr.io/linuxserver/qbittorrent@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed
          fi
          # The earlier image lives in this repository's own package. A brand-new
          # namespace has no package until this workflow publishes one, so a main build
          # may skip the upgrade gate once; a release tag never may.
          if docker pull "$EARLIER_IMAGE"; then
            echo "earlier=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Earlier release image $EARLIER_IMAGE is not available; the populated-library upgrade gate is skipped on this build"
            echo "earlier=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the earlier release image for a release tag
        if: startsWith(github.ref, 'refs/tags/v') && steps.fixtures.outputs.earlier != 'true'
        run: |
          echo "::error::A release build requires the earlier release image for the populated-library upgrade gate"
          exit 1

      - name: Isolated group, naming and AniList checks
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/anime-groups.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-groups.json"

      - name: Isolated Nyaa and multiple-season pack searches
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/nyaa-search.py --image tanukarr:verified --fixture \
            --report "${RUNNER_TEMP}/tanukarr-nyaa-fixture.json"
          python3 docker/tests/series-packs.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --report "${RUNNER_TEMP}/tanukarr-series-packs.json"

      - name: Isolated AniList quota recovery and safe membership resume
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/anilist-reliability.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-anilist-reliability.json"

      - name: Isolated import-list group collision recovery
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/group-import-collisions.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-group-import-collisions.json"

      - name: Isolated complete account snapshots, request sharing and provider identity
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/import-snapshots.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-import-snapshots.json"

      - name: Isolated MyAnimeList OAuth, lists and Jikan catalogue checks
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/myanimelist-reliability.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-myanimelist-reliability.json"

      - name: Isolated TMDB, Trakt, MDBList and complete Plex Watchlist checks
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/list-set-operations.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-list-set-operations.json"

      - name: Isolated Simkl AUTH V2 and incremental custom-list filtering
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/simkl-reliability.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-simkl-reliability.json"

      - name: Isolated editable quality limits and codec-normalized release decisions
        run: |
          python3 docker/tests/quality-codecs.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-quality-codecs.json"

      - name: Isolated custom qualities, profile codec factors and generated imports
        run: |
          python3 docker/tests/custom-qualities.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-custom-qualities.json"

      - name: Isolated alternate artwork, canonical collection metadata and cover recovery
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/artwork-reliability.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-artwork-reliability.json"

      - name: Real disposable qBittorrent configuration and collection folder imports
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/download-client-folders.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-download-client-folders.json"

      - name: Real disposable Jellyfin watched state and monitoring synchronization
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/jellyfin-watched.py --image tanukarr:verified \
            --jellyfin-image jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037 \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-jellyfin-watched.json"

      - name: Real disposable Jellyfin selected-library import and interval refresh
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/jellyfin-refresh.py --image tanukarr:verified \
            --jellyfin-image jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037 \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-jellyfin-refresh.json"

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.image.outputs.gates == 'full'
        with:
          node-version: 24

      - name: Prepare isolated packaged browser tooling
        if: steps.image.outputs.gates == 'full'
        run: |
          npm install --prefix "${RUNNER_TEMP}/tanukarr-browser" --no-audit --no-fund --ignore-scripts playwright@1.64.0
          "${RUNNER_TEMP}/tanukarr-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Packaged collection navigation, settings, searches and artwork
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/collections-browser.py --image tanukarr:verified --gui-audit \
            --browser-node "$(command -v node)" \
            --playwright-module "${RUNNER_TEMP}/tanukarr-browser/node_modules/playwright" \
            --playwright-version 1.64.0 --timeout 900 \
            --report "${RUNNER_TEMP}/tanukarr-collections-browser.json"

      - name: Packaged backup button, task timestamps, archive integrity and recovery
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/backup-tasks.py --image tanukarr:verified \
            --browser-node "$(command -v node)" \
            --playwright-module "${RUNNER_TEMP}/tanukarr-browser/node_modules/playwright" \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-backup-tasks.json"

      - name: Packaged first-run account creation and authentication security
        env:
          GATES: ${{ steps.image.outputs.gates }}
        run: |
          # The light profile installs no browser; it keeps the protected API/form checks.
          browser=()
          if [[ "$GATES" == full ]]; then
            browser=(--browser-node "$(command -v node)"
                     --playwright-module "${RUNNER_TEMP}/tanukarr-browser/node_modules/playwright"
                     --playwright-version 1.64.0)
          fi
          python3 docker/tests/first-run.py --image tanukarr:verified "${browser[@]}" \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-first-run.json"

      - name: Packaged metadata-source order, enablement and native TVmaze refresh
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/metadata-sources.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-metadata-sources.json"

      - name: Native film catalogues, IMDb lookup, mixed groups and refresh
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/movie-catalogues.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-movie-catalogues.json"

      - name: Generated pack downloads, automatic imports and real Jellyfin refresh
        if: steps.image.outputs.gates == 'full'
        run: |
          python3 docker/tests/download-packs.py --image tanukarr:verified --jellyfin --movies \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-download-packs.json"

      - name: Populated library migration, native anime films and preserved file identities
        if: steps.fixtures.outputs.earlier == 'true'
        run: |
          python3 docker/tests/library-upgrade.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-library-upgrade.json"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tanukarr-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tanukarr-smoke.json
            ${{ runner.temp }}/tanukarr-functional-security.json
            ${{ runner.temp }}/tanukarr-first-run.json
            ${{ runner.temp }}/tanukarr-metadata-sources.json
            ${{ runner.temp }}/tanukarr-metadata-sources.log
            ${{ runner.temp }}/tanukarr-movie-catalogues.json
            ${{ runner.temp }}/tanukarr-movie-catalogues.log
            ${{ runner.temp }}/tanukarr-download-packs.json
            ${{ runner.temp }}/tanukarr-download-packs.log
            ${{ runner.temp }}/tanukarr-library-upgrade.json
            ${{ runner.temp }}/tanukarr-library-upgrade.log
            ${{ runner.temp }}/tanukarr-first-run-browser/first-run-browser.json
            ${{ runner.temp }}/tanukarr-first-run-browser/create-account.png
            ${{ runner.temp }}/tanukarr-first-run-browser/create-account-mobile.png
            ${{ runner.temp }}/tanukarr-groups.json
            ${{ runner.temp }}/tanukarr-nyaa-fixture.json
            ${{ runner.temp }}/tanukarr-series-packs.json
            ${{ runner.temp }}/tanukarr-anilist-reliability.json
            ${{ runner.temp }}/tanukarr-group-import-collisions.json
            ${{ runner.temp }}/tanukarr-import-snapshots.json
            ${{ runner.temp }}/tanukarr-myanimelist-reliability.json
            ${{ runner.temp }}/tanukarr-list-set-operations.json
            ${{ runner.temp }}/tanukarr-simkl-reliability.json
            ${{ runner.temp }}/tanukarr-*.log
            ${{ runner.temp }}/tanukarr-quality-codecs.json
            ${{ runner.temp }}/tanukarr-backup-tasks.json
            ${{ runner.temp }}/backup-ui.json
            ${{ runner.temp }}/backup-browser.log
            ${{ runner.temp }}/tanukarr-jellyfin-watched.json
            ${{ runner.temp }}/tanukarr-custom-qualities.json
            ${{ runner.temp }}/tanukarr-artwork-reliability.json
            ${{ runner.temp }}/tanukarr-download-client-folders.json
            ${{ runner.temp }}/tanukarr-jellyfin-refresh.json
            ${{ runner.temp }}/tanukarr-collections-browser.json
            ${{ runner.temp }}/tanukarr-collections-browser-browser/*.png
            ${{ runner.temp }}/tanukarr-collections-browser-browser/collections-browser.json
          if-no-files-found: ignore

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the exact tested image; no second rebuild can change its contents.
      - name: Push verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag tanukarr:verified "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Generate CycloneDX SBOM for release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: tanukarr:verified
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/tanukarr-sbom.cdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Package verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          REPOSITORY: ${{ github.repository }}
          GATES: ${{ steps.image.outputs.gates }}
        run: |
          # Every gate of the selected profile must have produced a passing report.
          reports=(quality-codecs custom-qualities first-run library-upgrade)
          if [[ "$GATES" == full ]]; then
            reports=(groups nyaa-fixture series-packs anilist-reliability group-import-collisions
                     import-snapshots myanimelist-reliability list-set-operations simkl-reliability
                     quality-codecs backup-tasks jellyfin-watched custom-qualities artwork-reliability
                     download-client-folders jellyfin-refresh collections-browser first-run
                     metadata-sources movie-catalogues download-packs library-upgrade)
          fi
          arguments=()
          for report in "${reports[@]}"; do
            arguments+=(--verification-report "${RUNNER_TEMP}/tanukarr-${report}.json")
          done
          python3 docker/release/package.py \
            --version "$VERSION" --repository "$REPOSITORY" --image "$IMAGE:$VERSION" \
            --gate-profile "$GATES" \
            --sbom "${RUNNER_TEMP}/tanukarr-sbom.cdx.json" \
            --smoke-report "${RUNNER_TEMP}/tanukarr-smoke.json" \
            --functional-report "${RUNNER_TEMP}/tanukarr-functional-security.json" \
            "${arguments[@]}" \
            --output "${RUNNER_TEMP}/tanukarr-release"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.image.outputs.artifact }}
          path: ${{ runner.temp }}/tanukarr-release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      artifact: ${{ needs.publish.outputs.artifact }}
