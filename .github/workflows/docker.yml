name: Docker and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Pull requests build and run isolated checks without registry credentials.
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

jobs:
  publish:
    name: Verify and publish linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.image.outputs.version }}
      artifact: ${{ steps.image.outputs.artifact }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image and release version
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          image="ghcr.io/${REPOSITORY,,}"
          version="$(tr -d '\r\n' < VERSION)"
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
            [[ "$version" == "$(tr -d '\r\n' < VERSION)" ]] || exit 1
          fi
          echo "name=$image" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "artifact=Tanukarr-$version-release" >> "$GITHUB_OUTPUT"
          echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ steps.image.outputs.name }}
          # latest always selects a tested release, while edge selects main.
          tags: |
            type=sha,format=long,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build image with frontend and backend checks
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: tanukarr:verified
          build-args: |
            TANUKARR_VERSION=${{ steps.image.outputs.version }}
            TANUKARR_SOURCE=https://github.com/${{ github.repository }}
            TANUKARR_REVISION=${{ github.sha }}
            TANUKARR_CREATED=${{ steps.image.outputs.created }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container smoke checks
        run: |
          python3 docker/tests/smoke.py --image tanukarr:verified \
            --report "${RUNNER_TEMP}/tanukarr-smoke.json"

      - name: Isolated authentication and functional checks
        run: |
          python3 docker/tests/functional-security.py --image tanukarr:verified \
            --report "${RUNNER_TEMP}/tanukarr-functional-security.json"

      - name: Prepare disposable catalogue and RSS fixtures
        run: |
          if ! command -v openssl >/dev/null || ! command -v ffmpeg >/dev/null; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends openssl ffmpeg
          fi
          docker pull python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a
          docker pull jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037
          docker pull lscr.io/linuxserver/qbittorrent@sha256:97333cc1ccf903e0bbcd8eb67e3332e4970e9c1ecabe145e499e9c0847ebcaed

      - name: Isolated group, naming and AniList checks
        run: |
          python3 docker/tests/anime-groups.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-groups.json"

      - name: Isolated Nyaa and multiple-season pack searches
        run: |
          python3 docker/tests/nyaa-search.py --image tanukarr:verified --fixture \
            --report "${RUNNER_TEMP}/tanukarr-nyaa-fixture.json"
          python3 docker/tests/series-packs.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --report "${RUNNER_TEMP}/tanukarr-series-packs.json"

      - name: Isolated AniList quota recovery and safe membership resume
        run: |
          python3 docker/tests/anilist-reliability.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-anilist-reliability.json"

      - name: Isolated import-list group collision recovery
        run: |
          python3 docker/tests/group-import-collisions.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-group-import-collisions.json"

      - name: Isolated complete account snapshots, request sharing and provider identity
        run: |
          python3 docker/tests/import-snapshots.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-import-snapshots.json"

      - name: Isolated MyAnimeList OAuth, lists and Jikan catalogue checks
        run: |
          python3 docker/tests/myanimelist-reliability.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-myanimelist-reliability.json"

      - name: Isolated TMDB, Trakt, MDBList and complete Plex Watchlist checks
        run: |
          python3 docker/tests/list-set-operations.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-list-set-operations.json"

      - name: Isolated Simkl AUTH V2 and incremental custom-list filtering
        run: |
          python3 docker/tests/simkl-reliability.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-simkl-reliability.json"

      - name: Isolated editable quality limits and codec-normalized release decisions
        run: |
          python3 docker/tests/quality-codecs.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-quality-codecs.json"

      - name: Isolated backup task timestamps, archive integrity and failure recovery
        run: |
          python3 docker/tests/backup-tasks.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-backup-tasks.json"

      - name: Isolated custom qualities, profile codec factors and generated imports
        run: |
          python3 docker/tests/custom-qualities.py --image tanukarr:verified \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-custom-qualities.json"

      - name: Isolated alternate artwork, canonical collection metadata and cover recovery
        run: |
          python3 docker/tests/artwork-reliability.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-artwork-reliability.json"

      - name: Real disposable qBittorrent configuration and collection folder imports
        run: |
          python3 docker/tests/download-client-folders.py --image tanukarr:verified \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-download-client-folders.json"

      - name: Real disposable Jellyfin watched state and monitoring synchronization
        run: |
          python3 docker/tests/jellyfin-watched.py --image tanukarr:verified \
            --jellyfin-image jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037 \
            --mock-image python:3.13-alpine@sha256:2d9aefe2fef018a7eb2c13064c89c71929800fd2e5dccdbf52ea5da5bb8d929a \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-jellyfin-watched.json"

      - name: Real disposable Jellyfin selected-library import and interval refresh
        run: |
          python3 docker/tests/jellyfin-refresh.py --image tanukarr:verified \
            --jellyfin-image jellyfin/jellyfin:12.2@sha256:357724bf0ae27a672c7cbaa899db2d9abeb13dbd8657ccce750258a4c059d037 \
            --timeout 300 --report "${RUNNER_TEMP}/tanukarr-jellyfin-refresh.json"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Prepare isolated packaged browser tooling
        run: |
          npm install --prefix "${RUNNER_TEMP}/tanukarr-browser" --no-audit --no-fund --ignore-scripts playwright@1.64.0
          "${RUNNER_TEMP}/tanukarr-browser/node_modules/.bin/playwright" install --with-deps chromium

      - name: Packaged collection navigation, settings, searches and artwork
        run: |
          python3 docker/tests/collections-browser.py --image tanukarr:verified \
            --browser-node "$(command -v node)" \
            --playwright-module "${RUNNER_TEMP}/tanukarr-browser/node_modules/playwright" \
            --playwright-version 1.64.0 --timeout 300 \
            --report "${RUNNER_TEMP}/tanukarr-collections-browser.json"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tanukarr-verification-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tanukarr-smoke.json
            ${{ runner.temp }}/tanukarr-functional-security.json
            ${{ runner.temp }}/tanukarr-groups.json
            ${{ runner.temp }}/tanukarr-nyaa-fixture.json
            ${{ runner.temp }}/tanukarr-series-packs.json
            ${{ runner.temp }}/tanukarr-anilist-reliability.json
            ${{ runner.temp }}/tanukarr-group-import-collisions.json
            ${{ runner.temp }}/tanukarr-import-snapshots.json
            ${{ runner.temp }}/tanukarr-myanimelist-reliability.json
            ${{ runner.temp }}/tanukarr-list-set-operations.json
            ${{ runner.temp }}/tanukarr-simkl-reliability.json
            ${{ runner.temp }}/tanukarr-quality-codecs.json
            ${{ runner.temp }}/tanukarr-backup-tasks.json
            ${{ runner.temp }}/tanukarr-jellyfin-watched.json
            ${{ runner.temp }}/tanukarr-custom-qualities.json
            ${{ runner.temp }}/tanukarr-artwork-reliability.json
            ${{ runner.temp }}/tanukarr-download-client-folders.json
            ${{ runner.temp }}/tanukarr-jellyfin-refresh.json
            ${{ runner.temp }}/tanukarr-collections-browser.json
            ${{ runner.temp }}/tanukarr-collections-browser-browser/collection-anime-desktop.png
            ${{ runner.temp }}/tanukarr-collections-browser-browser/collection-mixed-desktop.png
            ${{ runner.temp }}/tanukarr-collections-browser-browser/collection-native-desktop.png
            ${{ runner.temp }}/tanukarr-collections-browser-browser/collection-mixed-mobile.png
          if-no-files-found: ignore

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Publish the exact tested image; no second rebuild can change its contents.
      - name: Push verified image
        if: github.event_name != 'pull_request'
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            [[ -n "$tag" ]] || continue
            docker tag tanukarr:verified "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"

      - name: Generate CycloneDX SBOM for release image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          image: tanukarr:verified
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/tanukarr-sbom.cdx.json
          syft-version: v1.54.1
          upload-artifact: false
          upload-release-assets: false

      - name: Package verified release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VERSION: ${{ steps.image.outputs.version }}
          IMAGE: ${{ steps.image.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 docker/release/package.py \
            --version "$VERSION" --repository "$REPOSITORY" --image "$IMAGE:$VERSION" \
            --sbom "${RUNNER_TEMP}/tanukarr-sbom.cdx.json" \
            --smoke-report "${RUNNER_TEMP}/tanukarr-smoke.json" \
            --functional-report "${RUNNER_TEMP}/tanukarr-functional-security.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-groups.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-nyaa-fixture.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-series-packs.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-anilist-reliability.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-group-import-collisions.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-import-snapshots.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-myanimelist-reliability.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-list-set-operations.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-simkl-reliability.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-quality-codecs.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-backup-tasks.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-jellyfin-watched.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-custom-qualities.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-artwork-reliability.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-download-client-folders.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-jellyfin-refresh.json" \
            --verification-report "${RUNNER_TEMP}/tanukarr-collections-browser.json" \
            --output "${RUNNER_TEMP}/tanukarr-release"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.image.outputs.artifact }}
          path: ${{ runner.temp }}/tanukarr-release/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.publish.outputs.version }}
      artifact: ${{ needs.publish.outputs.artifact }}
