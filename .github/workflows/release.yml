name: Publish verified release

on:
  workflow_call:
    inputs:
      version:
        description: Validated Tanukarr semantic version without the v prefix
        required: true
        type: string
      artifact:
        description: Release asset artifact created after image verification
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/tanukarr-release

      - name: Verify downloaded asset checksums
        working-directory: ${{ runner.temp }}/tanukarr-release
        run: sha256sum --check SHA256SUMS

      - name: Publish release with tested assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          ASSET_PATH: ${{ runner.temp }}/tanukarr-release
        run: |
          tag="v$RELEASE_VERSION"
          notes="docs/releases/$RELEASE_VERSION.md"
          test -f "$notes"
          rendered_notes="$RUNNER_TEMP/tanukarr-release-notes.md"
          python3 - "$notes" "$rendered_notes" <<'PY'
          import os
          from pathlib import Path
          import re
          import sys
          from urllib.parse import urljoin, urlsplit
          base = f"https://github.com/{os.environ['GH_REPO']}/blob/main/docs/releases/"
          def absolute_link(match):
              label, target = match.groups()
              if urlsplit(target).scheme or target.startswith('#'):
                  return match.group(0)
              return f"[{label}]({urljoin(base, target)})"
          Path(sys.argv[2]).write_text(re.sub(r'\[([^\]]+)\]\(([^\s)]+)\)', absolute_link,
                                            Path(sys.argv[1]).read_text()), encoding='utf-8')
          PY
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ASSET_PATH"/* --clobber
            gh release edit "$tag" --title "Tanukarr $RELEASE_VERSION" \
              --notes-file "$rendered_notes" --draft=false --latest
          else
            gh release create "$tag" "$ASSET_PATH"/* --verify-tag \
              --title "Tanukarr $RELEASE_VERSION" --notes-file "$rendered_notes" --latest
          fi
