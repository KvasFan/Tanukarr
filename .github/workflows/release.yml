name: Publish verified release

on:
  workflow_call:
    inputs:
      version:
        description: Validated Tanukarr semantic version without the v prefix
        required: true
        type: string
      artifact:
        description: Release asset artifact created after image verification
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/tanukarr-release

      - name: Verify downloaded asset checksums
        working-directory: ${{ runner.temp }}/tanukarr-release
        run: sha256sum --check SHA256SUMS

      - name: Publish release with tested assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
          ASSET_PATH: ${{ runner.temp }}/tanukarr-release
        run: |
          tag="v$RELEASE_VERSION"
          notes="docs/releases/$RELEASE_VERSION.md"
          test -f "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$ASSET_PATH"/* --clobber
            gh release edit "$tag" --title "Tanukarr $RELEASE_VERSION" \
              --notes-file "$notes" --draft=false --latest
          else
            gh release create "$tag" "$ASSET_PATH"/* --verify-tag \
              --title "Tanukarr $RELEASE_VERSION" --notes-file "$notes" --latest
          fi
