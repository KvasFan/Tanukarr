name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json

      # Building the solution rather than individual projects is required, not a
      # preference: Directory.Build.props pulls in stylecop.json through $(SolutionDir),
      # which is only defined for a solution build. Building a bare .csproj silently
      # drops the StyleCop configuration and fails on every using directive in the repo.
      - name: Build
        run: dotnet build src/Sonarr.sln -c Debug

      - name: Prepare media probe for tests
        run: chmod +x _tests/net10.0/ffprobe

      - name: Test
        run: dotnet test src/NzbDrone.Core.Test/Sonarr.Core.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: API resource tests
        run: dotnet test src/NzbDrone.Api.Test/Sonarr.Api.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: HTTP tests
        run: dotnet test src/Sonarr.Http.Test/Sonarr.Http.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: Common security regression tests
        run: dotnet test src/NzbDrone.Common.Test/Sonarr.Common.Test.csproj -c Debug --no-build --filter "FullyQualifiedName~SonarrCloudRequestPolicyFixture|FullyQualifiedName~CleanseLogMessageFixture|FullyQualifiedName~BuildInfoFixture|FullyQualifiedName~HttpResponseLoggingFixture|FullyQualifiedName~HttpClientSuppressedLoggingFixture" --logger "console;verbosity=minimal"

      - name: Install FFmpeg for generated media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Compression worker safety and generated media tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SONARR_COMPRESSION_INTEGRATION: '1'
        run: python3 docker/compression/test_worker.py

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile --network-timeout 600000

      - run: yarn test:queue-details

      - run: yarn lint

      - run: yarn stylelint -f github

      - run: yarn typecheck

      - run: yarn build
