name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Building the solution rather than individual projects is required, not a
      # preference: Directory.Build.props pulls in stylecop.json through $(SolutionDir),
      # which is only defined for a solution build. Building a bare .csproj silently
      # drops the StyleCop configuration and fails on every using directive in the repo.
      - name: Build
        # Platform projects share _output; serialize copies as in the Docker build.
        run: dotnet build src/Sonarr.sln -c Debug -maxcpucount:1 -p:BuildInParallel=false

      - name: Prepare media probe for tests
        run: chmod +x _tests/net10.0/ffprobe

      - name: Test
        run: dotnet test src/NzbDrone.Core.Test/Sonarr.Core.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: API resource tests
        run: dotnet test src/NzbDrone.Api.Test/Sonarr.Api.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: Real PostgreSQL collection migration and concurrent range validation
        run: python3 docker/tests/postgres-collections.py --report "${RUNNER_TEMP}/tanukarr-postgres-collections.json"

      - name: Upload PostgreSQL verification
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tanukarr-postgres-collections-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/tanukarr-postgres-collections.json
            ${{ runner.temp }}/tanukarr-postgres-collections.log
          if-no-files-found: ignore

      - name: HTTP tests
        run: dotnet test src/Sonarr.Http.Test/Sonarr.Http.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: Host and container health tests
        run: dotnet test src/NzbDrone.Host.Test/Sonarr.Host.Test.csproj -c Debug --no-build --filter "TestCategory!=IntegrationTest" --logger "console;verbosity=minimal"

      - name: Common security regression tests
        run: dotnet test src/NzbDrone.Common.Test/Sonarr.Common.Test.csproj -c Debug --no-build --filter "FullyQualifiedName~SonarrCloudRequestPolicyFixture|FullyQualifiedName~CleanseLogMessageFixture|FullyQualifiedName~BuildInfoFixture|FullyQualifiedName~HttpResponseLoggingFixture|FullyQualifiedName~HttpClientSuppressedLoggingFixture" --logger "console;verbosity=minimal"

      - name: Install FFmpeg for generated media tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Compression worker safety and generated media tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          SONARR_COMPRESSION_INTEGRATION: '1'
        run: python3 docker/compression/test_worker.py

  frontend:
    name: Lint and build frontend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --immutable

      - run: yarn test:queue-details

      - run: yarn lint

      - run: yarn stylelint

      - run: yarn typecheck

      - run: yarn build
