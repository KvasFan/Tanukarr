name: Build Backend
description: Builds the backend and packages it

inputs:
  branch:
    description: "Branch name for this build"
    required: true
  version:
    description: "Version number to build"
    required: true
  framework:
    description: ".net framework used for the build"
    required: true
  runtime:
    description: "Run time to build for"
    required: true
  package_tests:
    description: "True if tests should be packaged for later testing steps"

runs:
  using: "composite"
  steps:
    - name: Cache nuget packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj', '**/Directory.*.props') }}
        restore-keys:
          ${{ runner.os }}-nuget-

    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6

    - name: Setup NuGet registry source
      shell: bash
      if: ${{ startsWith(inputs.runtime, 'freebsd') }}
      env:
        REGISTRY_USER: ${{ github.repository_owner }}
        REGISTRY_TOKEN: ${{ github.token }}
      run:
        dotnet nuget add source --configfile src/NuGet.Config --name gh-openur https://nuget.pkg.github.com/openur/index.json --username "$REGISTRY_USER" --password "$REGISTRY_TOKEN" --store-password-in-clear-text

    - name: Setup Environment Variables
      id: variables
      shell: bash
      env:
        SONARR_VERSION: ${{ inputs.version }}
        BRANCH: ${{ inputs.branch }}
        FRAMEWORK: ${{ inputs.framework }}
        RUNTIME: ${{ inputs.runtime }}
      run: |
        set -euo pipefail
        for name in SONARR_VERSION BRANCH FRAMEWORK RUNTIME; do
          value="${!name}"
          case "$value" in
            *$'\n'*|*$'\r'*) printf 'Invalid multiline input: %s\n' "$name" >&2; exit 1 ;;
          esac
        done
        [[ -z "$SONARR_VERSION" || "$SONARR_VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]
        git check-ref-format --branch "$BRANCH" >/dev/null
        [[ "$FRAMEWORK" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
        [[ "$RUNTIME" =~ ^[a-z0-9]+(-[a-z0-9]+)+$ ]]
        DOTNET_VERSION=$(jq -r '.sdk.version' global.json)

        printf 'SDK_PATH=%s/sdk/%s\nSONARR_VERSION=%s\nBRANCH=%s\nFRAMEWORK=%s\nRUNTIME=%s\n' \
          "$DOTNET_ROOT" "$DOTNET_VERSION" "$SONARR_VERSION" "$BRANCH" "$FRAMEWORK" "$RUNTIME" >> "$GITHUB_ENV"

    - name: Enable Extra Platforms In SDK
      if: ${{ inputs.runtime == 'freebsd-x64' }}
      shell: bash
      run: |
        BUNDLEDVERSIONS="${SDK_PATH}/Microsoft.NETCoreSdk.BundledVersions.props"

        if grep -q freebsd-x64 "$BUNDLEDVERSIONS"; then
          echo "Extra platforms already enabled"
        else
          echo "Enabling extra platform support"
          sed -i.ORI 's/osx-x64/osx-x64;freebsd-x64/' "$BUNDLEDVERSIONS"
        fi

        if grep -qv freebsd-x64 src/Directory.Build.props; then
          sed -i'' -e "s^<RuntimeIdentifiers>\(.*\)</RuntimeIdentifiers>^<RuntimeIdentifiers>\1;freebsd-x64</RuntimeIdentifiers>^g" src/Directory.Build.props
        fi

    - name: Update Version Number
      shell: bash
      run: |
        if [ "$SONARR_VERSION" != "" ]; then
          echo "Updating version info to: $SONARR_VERSION"
          xml_branch=$(printf '%s' "$BRANCH" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          sed_branch=$(printf '%s' "$xml_branch" | sed 's/[\\&/]/\\&/g')
          sed -i'' -e "s/<AssemblyVersion>[0-9.*]\+<\/AssemblyVersion>/<AssemblyVersion>$SONARR_VERSION<\/AssemblyVersion>/g" src/Directory.Build.props
          sed -i'' -e "s/<AssemblyConfiguration>[\$()A-Za-z-]\+<\/AssemblyConfiguration>/<AssemblyConfiguration>${sed_branch}<\/AssemblyConfiguration>/g" src/Directory.Build.props
          sed -i'' -e "s/<string>10.0.0.0<\/string>/<string>$SONARR_VERSION<\/string>/g" distribution/macOS/Sonarr.app/Contents/Info.plist
        fi

    - name: Build Backend
      shell: bash
      run: |
        runtime="$RUNTIME"
        platform=Windows
        slnFile=src/Sonarr.sln
        targetingWindows=false

        IFS='-' read -ra SPLIT <<< "$runtime"

        if [ "${SPLIT[0]}" == "win" ]; then
          platform=Windows
          targetingWindows=true
        else
          platform=Posix
        fi

        rm -rf _output
        rm -rf _tests

        echo "Building Sonarr for $runtime, Platform: $platform"

        dotnet msbuild -restore "$slnFile" -p:SelfContained=true -p:Configuration=Release -p:Platform="$platform" -p:RuntimeIdentifiers="$runtime" -p:EnableWindowsTargeting=true -t:PublishAllRids

    - name: Package
      shell: bash
      run: |
        framework="$FRAMEWORK"
        runtime="$RUNTIME"

        IFS='-' read -ra SPLIT <<< "$runtime"

        case "${SPLIT[0]}" in
          linux|freebsd*)
            folder=_artifacts/$runtime/$framework/Sonarr

            echo "Packaging files"
            rm -rf $folder
            mkdir -p $folder
            cp -r _output/$framework/$runtime/publish/* $folder
            cp -r _output/Sonarr.Update/$framework/$runtime/publish $folder/Sonarr.Update
            cp LICENSE.md $folder

            echo "Removing Service helpers"
            rm -f $folder/ServiceUninstall.*
            rm -f $folder/ServiceInstall.*

            echo "Removing Sonarr.Windows"
            rm $folder/Sonarr.Windows.*

            echo "Adding Sonarr.Mono to UpdatePackage"
            cp $folder/Sonarr.Mono.* $folder/Sonarr.Update
            cp $folder/Openur.Mono.Unix.* $folder/Sonarr.Update
            cp $folder/libMono.Unix.* $folder/Sonarr.Update
            ;;
          win)
            folder=_artifacts/$runtime/$framework/Sonarr

            echo "Packaging files"
            rm -rf $folder
            mkdir -p $folder
            cp -r _output/$framework/$runtime/publish/* $folder
            cp -r _output/Sonarr.Update/$framework/$runtime/publish $folder/Sonarr.Update
            cp LICENSE.md $folder
            cp -r _output/$framework-windows/$runtime/publish/* $folder

            echo "Removing Sonarr.Mono"
            rm -f $folder/Sonarr.Mono.*
            rm -f $folder/Openur.Mono.Unix.*
            rm -f $folder/libMono.Unix.*

            echo "Adding Sonarr.Windows to UpdatePackage"
            cp $folder/Sonarr.Windows.* $folder/Sonarr.Update

            ;;
          osx)
            folder=_artifacts/$runtime/$framework/Sonarr

            echo "Packaging files"
            rm -rf $folder
            mkdir -p $folder
            cp -r _output/$framework/$runtime/publish/* $folder
            cp -r _output/Sonarr.Update/$framework/$runtime/publish $folder/Sonarr.Update
            cp LICENSE.md $folder

            echo "Removing Service helpers"
            rm -f $folder/ServiceUninstall.*
            rm -f $folder/ServiceInstall.*

            echo "Removing Sonarr.Windows"
            rm $folder/Sonarr.Windows.*

            echo "Adding Sonarr.Mono to UpdatePackage"
            cp $folder/Sonarr.Mono.* $folder/Sonarr.Update
            cp $folder/Openur.Mono.Unix.* $folder/Sonarr.Update
            cp $folder/libMono.Unix.* $folder/Sonarr.Update
            ;;
        esac

    - name: Package Tests
      if: ${{ inputs.package_tests }}
      shell: bash
      run: |
        framework="$FRAMEWORK"
        runtime="$RUNTIME"

        cp scripts/test.sh "_tests/$framework/$runtime/publish"

        rm -f _tests/$framework/$runtime/*.log.config

    - name: Upload Test Artifacts
      if: ${{ inputs.package_tests }}
      uses: ./.github/actions/publish-test-artifact
      with:
        framework: ${{ inputs.framework }}
        runtime: ${{ inputs.runtime }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: build-${{ inputs.runtime }}
        path: _artifacts/**/*
