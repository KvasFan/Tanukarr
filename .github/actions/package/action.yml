name: Package
description: Packages binaries for deployment

inputs:
  runtime:
    description: "Binary runtime"
    required: true
  framework:
    description: ".net framework"
    required: true
  artifact:
    description: "Binary artifact"
    required: true
  branch:
    description: "Git branch used for this build"
    required: true
  major_version:
    description: "Sonarr major version"
    required: true
  version:
    description: "Sonarr version"
    required: true

runs:
  using: "composite"
  steps:
    - name: Download Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: ${{ inputs.artifact }}
        path: _output

    - name: Download UI Artifact
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
      with:
        name: build_ui
        path: _output/UI

    - name: Configure Environment Variables
      shell: bash
      env:
        FRAMEWORK: ${{ inputs.framework }}
        BRANCH: ${{ inputs.branch }}
        SONARR_MAJOR_VERSION: ${{ inputs.major_version }}
        SONARR_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        for name in FRAMEWORK BRANCH SONARR_MAJOR_VERSION SONARR_VERSION; do
          value="${!name}"
          case "$value" in
            *$'\n'*|*$'\r'*) printf 'Invalid multiline input: %s\n' "$name" >&2; exit 1 ;;
          esac
        done
        [[ "$FRAMEWORK" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
        git check-ref-format --branch "$BRANCH" >/dev/null
        [[ "$SONARR_MAJOR_VERSION" =~ ^[0-9]+$ ]]
        [[ "$SONARR_VERSION" =~ ^[0-9]+(\.[0-9]+){2,3}$ ]]
        printf 'FRAMEWORK=%s\nBRANCH=%s\nSONARR_MAJOR_VERSION=%s\nSONARR_VERSION=%s\n' \
          "$FRAMEWORK" "$BRANCH" "$SONARR_MAJOR_VERSION" "$SONARR_VERSION" >> "$GITHUB_ENV"

    - name: Create Packages
      shell: bash
      run: '"$GITHUB_ACTION_PATH/package.sh"'

    - name: Create Windows Installer (x64)
      if: ${{ inputs.runtime == 'win-x64' }}
      working-directory: distribution/windows/setup
      shell: cmd
      run: |
        SET RUNTIME=win-x64

        build.bat

    - name: Create Windows Installer (x86)
      if: ${{ inputs.runtime == 'win-x86' }}
      working-directory: distribution/windows/setup
      shell: cmd
      run: |
        SET RUNTIME=win-x86

        build.bat

    - name: Upload Artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
      with:
        name: release-${{ inputs.runtime }}
        compression-level: 0
        if-no-files-found: error
        path: |
          _artifacts/*.exe
          _artifacts/*.tar.gz
          _artifacts/*.zip
